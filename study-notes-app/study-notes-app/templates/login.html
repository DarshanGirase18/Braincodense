{% extends "base.html" %}
{% block title %}Sign in — BrainCondense{% endblock %}
{% block content %}

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="card-icon">⚡</div>
    <h2>Welcome back.</h2>
    <p class="card-subtitle">Sign in to your BrainCondense command centre.</p>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="login-username">Username or email</label>
        <input id="login-username" type="text" name="username" placeholder="you@example.com" required autofocus>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" name="password" placeholder="••••••••" required>
      </div>
      <button id="login-submit" class="btn btn-primary" type="submit">Sign in →</button>
    </form>

    <p class="auth-switch">
      No account? <a href="{{ url_for('register') }}">Request access</a>
    </p>
  </div>
</div>

{% endblock %}
