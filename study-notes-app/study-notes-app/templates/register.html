{% extends "base.html" %}
{% block title %}Request Access — BrainCondense{% endblock %}
{% block content %}

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="card-icon">✦</div>
    <h2>Request access.</h2>
    <p class="card-subtitle">Create your BrainCondense account and start condensing in seconds.</p>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input id="reg-username" type="text" name="username" placeholder="johnsmith" required autofocus>
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" name="password" placeholder="Minimum 6 characters" minlength="6" required>
      </div>
      <button id="reg-submit" class="btn btn-primary" type="submit">Create account →</button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </p>
  </div>
</div>

{% endblock %}
